<!DOCTYPE html>
{% extends "base.html" %}

{% block title %}Select Domain and Subdomain{% endblock %}

{% block content %}
<style>
    body {
        font-family: Arial, sans-serif;
    }

    .container {
        max-width: 600px;
        margin: 50px auto;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .card {
        background-color: #fff;
        border-radius: 8px;
        overflow: hidden;
    }

    .card-header {
        background-color: #007bff;
        color: white;
        padding: 15px;
        font-size: 18px;
        font-weight: bold;
    }

    .card-body {
        padding: 20px;
    }

    .form-group {
        margin-bottom: 15px;
    }

    .form-label {
        display: block;
        font-weight: bold;
        margin-bottom: 5px;
    }

    .form-select {
        width: 100%;
        padding: 10px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
    }

    .form-select:disabled {
        background-color: #f8f9fa;
        cursor: not-allowed;
    }

    .btn {
        display: inline-block;
        padding: 10px 15px;
        font-size: 16px;
        font-weight: bold;
        color: white;
        background-color: #0d6efd;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        text-align: center;
    }

    .btn:disabled {
        background-color: #6c757d;
        cursor: not-allowed;
    }

    .btn:hover:not(:disabled) {
        background-color: #0d6efd;
    }
</style>

<div class="container">
    <div class="card">
        <div class="card-header">Select a Domain and Subdomain</div>
        <div class="card-body">
            <form id="domainForm" method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="id_domain" class="form-label">Domain:</label>
                    <select id="id_domain" name="domain" class="form-select">
                        <option value="" selected disabled>Select a domain</option>
                        {% for domain in domains %}
                        <option value="{{ domain.id }}">{{ domain.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="id_subdomain" class="form-label">Subdomain:</label>
                    <select id="id_subdomain" name="subdomain" class="form-select" disabled>
                        <option value="" selected disabled>Select a subdomain</option>
                    </select>
                </div>
                <button id="continueButton" type="submit" class="btn" disabled>Continue to Auditing</button>
            </form>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const domainSelect = document.getElementById("id_domain");
        const subdomainSelect = document.getElementById("id_subdomain");
        const continueButton = document.getElementById("continueButton");

        subdomainSelect.disabled = true;
        continueButton.disabled = true;

        domainSelect.addEventListener("change", async () => {
            const domainId = domainSelect.value;

            // Reset subdomain dropdown and button
            subdomainSelect.innerHTML = `
            <option value="" selected disabled>Select a subdomain</option>
        `;
            subdomainSelect.disabled = true;
            continueButton.disabled = true;

            if (domainId) {
                try {
                    const response = await fetch(`/projects/get-subdomains/${domainId}/`);
                    const data = await response.json(); // Parse the JSON response
                    const subdomains = data.subdomains; // Extract the subdomains array

                    console.log("Subdomains response:", subdomains); // Debugging output

                    if (Array.isArray(subdomains)) {
                        subdomains.forEach(subdomain => {
                            const option = document.createElement("option");
                            option.value = subdomain.id;
                            option.textContent = subdomain.name;
                            subdomainSelect.appendChild(option);
                        });

                        subdomainSelect.disabled = false; // Enable subdomain dropdown
                    } else {
                        throw new Error("Subdomains data is not an array.");
                    }
                } catch (error) {
                    console.error("Error fetching subdomains:", error);
                    alert("Unable to fetch subdomains. Check your internet connection or contact support.");
                }
            }
        });

        subdomainSelect.addEventListener("change", () => {
            continueButton.disabled = !subdomainSelect.value; // Enable button only if subdomain selected
        });
    });

</script>

{% endblock %}
