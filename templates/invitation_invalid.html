<!DOCTYPE html>
{% extends "base.html" %}

{% block title %}Invalid Invitation{% endblock title %}

{% block content %}
<style>
    .container {
        max-width: 600px;
        margin: 50px auto;
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        font-family: Arial, sans-serif;
        text-align: center;
    }

    .container h1 {
        font-size: 28px;
        color: #a71d2a;
        margin-bottom: 20px;
    }

    .container p {
        font-size: 18px;
        color: #555;
        margin-bottom: 20px;
    }

    .btn {
        display: inline-block;
        padding: 10px 20px;
        font-size: 16px;
        color: white;
        background-color: #007bff;
        text-decoration: none;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        margin: 10px 0;
    }

    .btn:hover {
        background-color: #0056b3;
    }
</style>

<div class="container">
    <h1>Invalid Invitation</h1>
    <p>{{ error }}</p>
    <a href="{% url 'home' %}" class="btn">Go to Homepage</a>
</div>
{% endblock content %}
