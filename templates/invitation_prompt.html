<!DOCTYPE html>
{% extends "base.html" %}
{% block title %}invitation_prompt{% endblock title %}
{% block content %}
<h1>Invitation to Join {{ project.title }}</h1>
<p>Would you like to join this project as an Auditor?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" name="accept">Accept</button>
    <button type="submit" name="reject">Reject</button>
</form>
{% endblock content %}
