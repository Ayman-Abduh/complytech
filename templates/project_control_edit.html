<!DOCTYPE html>
{% extends "base.html" %}

{% block title %}Edit Project Control{% endblock %}

{% load crispy_forms_tags %}

{% block content %}
<style>
    .container {
        max-width: 600px;
        margin: 20px auto;
        padding: 20px;
        background-color: #fff;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .header {
        text-align: center;
        margin-bottom: 20px;
    }

    .header h1 {
        margin: 0;
        color: #333;
    }

    .header p {
        margin: 5px 0;
        font-size: 14px;
        color: #555;
    }

    .btn-container {
        display: flex;
        justify-content: space-between;
        margin-top: 20px;
    }

    .btn {
        padding: 10px 15px;
        font-size: 16px;
        font-weight: bold;
        color: white;
        background-color: #007bff;
        border: none;
        border-radius: 4px;
        text-decoration: none;
        text-align: center;
    }

    .btn:hover {
        background-color: #0056b3;
        color: white;
    }

    .btn-save {
        margin-left: auto;
        /* Pushes the button to the right */
    }
</style>

<div class="container">
    <div class="header">
        <h1>Project: {{project_control.project.title | title}}</h1>
        <h2>Edit Control: {{ project_control.control.code }}</h2>
    </div>

    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <div class="btn-container">
            <a href="{% url 'project_control_list' project_control.project.id project_control.control.subdomain.id %}"
                class="btn">Cancel</a>
            <button type="submit" class="btn btn-save">Save Changes</button>
        </div>
    </form>
</div>
{% endblock content %}
